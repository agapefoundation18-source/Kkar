<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Kkary Rider — local mobility</title>
    <meta name="theme-color" content="#030A13" />
    <meta name="description" content="Kkary Rider — Ride Safe. Ride Easy. Book trusted local rides with clear fares and live trip updates." />
    <meta name="application-name" content="Kkary Rider" />
    <link id="kkary-apple-icon" rel="apple-touch-icon" href="/icons/rider-192.png" />
    
    <!-- PWA Manifest -->
    <script>
      const isDriverApp = window.location.pathname === "/drivers" || window.location.pathname.startsWith("/drivers/");
      document.write(`<link id="kkary-manifest" rel="manifest" href="${isDriverApp ? "/manifest-driver.json" : "/manifest.json"}">`);
    </script>
    <!-- PWA Metadata -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kkary Rider" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#113a3b" />
    <script>
      if (isDriverApp) {
        document.title = "Kkary Driver — local mobility";
        document.querySelector('meta[name="theme-color"]').content = "#030A13";
        document.querySelector('meta[name="application-name"]').content = "Kkary Driver";
        document.querySelector('meta[name="apple-mobile-web-app-title"]').content = "Kkary Driver";
        document.getElementById("kkary-apple-icon").href = "/icons/rider-192.png";
      } else {
        document.querySelector('meta[name="theme-color"]').content = "#030A13";
        document.querySelector('meta[name="application-name"]').content = "Kkary Rider";
        document.querySelector('meta[name="apple-mobile-web-app-title"]').content = "Kkary Rider";
        document.getElementById("kkary-apple-icon").href = "/icons/rider-192.png";
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('Service Worker registered:', reg);
          }).catch((err) => {
            console.log('Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>

</html>
